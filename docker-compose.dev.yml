services:
  db:
    image: postgis/postgis:16-3.4
    container_name: michi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-michi} -d ${POSTGRES_DB:-michi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - michi-net

  api:
    build:
      context: .
      dockerfile: Michi.API/Dockerfile
    container_name: michi-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "${API_PORT:-9090}:8080"
    networks:
      - michi-net

  s3:
    image: rustfs/rustfs:latest
    container_name: michi-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - michi-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: michi-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - michi-net

networks:
  michi-net:
    driver: bridge

volumes:
  db-data:
  s3-data: